name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (obfstr2 + obfstr2-macros)
        run: |
          cargo fmt --all -- --check
          cd obfstr2-macros && cargo fmt --all -- --check

      - name: clippy (obfstr2 + obfstr2-macros)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cd obfstr2-macros && cargo clippy --all-targets --all-features -- -D warnings \
            -W clippy::missing_errors_doc \
            -W clippy::missing_panics_doc \
            -W clippy::undocumented_unsafe_blocks \
            -W clippy::unwrap_used \
            -W clippy::expect_used

      - name: test (obfstr2 + obfstr2-macros)
        run: |
          cargo test --all-features --all-targets
          cd obfstr2-macros && cargo test --all-features --all-targets

      - name: doctest (obfstr2-macros)
        run: |
          cd obfstr2-macros && cargo test --doc --all-features

      - name: doc build (deny warnings)
        run: |
          cargo doc --no-deps --all-features
          cd obfstr2-macros && cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
