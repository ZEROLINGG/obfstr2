[package]
name = "obfstr2"
version = "0.1.0"
edition = "2024"
resolver = "2"
description = "高度多态化的编译期字符串/字节/文件混淆库（no_std 兼容）"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZEROLINGG/obfstr2"


[dependencies]
macros-obfstr = { path = "macros-obfstr" }
lib-unknown = { version = "0.1", default-features = false, features = ["crypto", "types"] }


[features]
default = [
    "lib-unknown/alloc",
    "macros-obfstr/alloc"
]
