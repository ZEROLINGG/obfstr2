[package]
name = "obfstr2-macros"
version = "0.1.7"
edition = "2024"
resolver = "2"
rust-version = "1.98"
description = "Proc-macros for obfstr2 compile-time obfuscation (internal-only, no runtime; use `obfstr2` directly)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZEROLINGG/obfstr2"
keywords = ["obfuscation", "proc-macro", "string", "no-std", "compile-time"]
categories = ["no-std", "development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "derive", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

lib-unknown = { version = "0.1.6", default-features = false, features = ["rand", "rand-expand", "crypto", "dyntest", "std"]}

[features]
default = [
]
alloc = []
