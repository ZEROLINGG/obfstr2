[package]
name = "obfstr2-macros"
version = "0.1.2"
edition = "2024"
resolver = "2"
description = "obfstr2 的过程宏实现：字符串/字节/文件编译期混淆入口"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZEROLINGG/obfstr2"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "derive", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"

lib-unknown = { version = "0.1", default-features = false, features = ["rand", "rand-expand", "crypto", "dyntest", "std"]}

[dev-dependencies]
lib-unknown = { version = "0.1", features = ["dyntest", "std"] }

[features]
default = [
]
alloc = []
